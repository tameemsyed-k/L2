---
- name: Install nginx on SERVER
  hosts: localhost
  become: yes

  tasks:
   - name: installing nginx on SERVER
     ansible.builtin.package:
      name: nginx
      state: present

   - name: starting nginx service
     ansible.builtin.service:
      name: nginx
      state: started


